tier=A
# First-party served trees: the admin shell's assets and vendored Flag
# (public/), the shipped page templates (templates/, customer-page starting
# points that load nothing remote either; the content-host CSP would block it),
# and the Go packages that build served HTML: the admin shell and gate pages
# (internal/shell), the Flag tags injected into themed pages (internal/render),
# the content host's own documents (internal/contentview) and redirect bodies
# (internal/httpx).
web=public templates internal/shell internal/render internal/contentview internal/httpx
npm=.
backend=go
