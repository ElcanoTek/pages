name: Bug report
description: Something in Pages behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Deploy a page with…
        2. …
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you are running (`pages status`, or `git rev-parse --short HEAD`).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Admin UI, REST API (/api/v1), MCP (/mcp), Content host / rendering / CSP, Templates / data-only updates, Partner portals / passwords, Deployment scripts, Docs]
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: Redact tokens, cookies and any real client data before pasting.
      render: text
