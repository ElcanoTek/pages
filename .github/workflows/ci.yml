name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR supersedes its running check. Every other event
# (each push to main, the schedule) gets its own per-commit group, so no main
# commit is skipped by a later push replacing its pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The matrix is the supported range, not a pin: its ends are package.json's
    # `engines.node` floors (^20.19.0 || >=22.12.0), plus the newest LTS major.
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.0, 22.12.0, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Dependency audit (production)
        # Fail on HIGH/CRITICAL advisories in the production tree. This once
        # carried a note about two accepted moderates in @hono/node-server,
        # bundled by the MCP SDK. The SDK (and hono with it) has since left the
        # production tree entirely — /mcp is served in-house and the SDK is a
        # test-only devDependency — and the tree audits clean at every level.
        #
        # The threshold stays at `high` deliberately, as a policy rather than a
        # workaround for those two: a moderate in a transitive dependency should
        # be read and judged, not made to block every unrelated PR the moment it
        # is published. Tighten this to `moderate` if that trade stops being the
        # right one — the tree is clean today, so it would cost nothing now.
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Shell syntax check
        run: |
          for f in install.sh scripts/*.sh test/*.sh deploy/pages-cli; do
            bash -n "$f"
          done
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser accessibility and workflow tests
        run: npm run test:browser
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.node }}
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Integration suite
        # Runs as the unprivileged runner user — exercises the non-root
        # provisioning path (a throwaway cluster via the preinstalled PG 16).
        run: bash test/run-integration.sh
