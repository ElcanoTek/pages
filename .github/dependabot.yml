# Dependabot proposes updates for Pages' two dependency surfaces: the npm
# package at the repo root (production AND dev dependencies — playwright, axe
# and the MCP SDK the conformance tests drive get updates too) and the GitHub
# Actions the workflows use. Modelled on fleet's .github/dependabot.yml, which
# carries the long-form reasoning.
#
# Cadence: polled daily, with a supply-chain `cooldown` on npm so a freshly
# published release waits a few days (7 for majors and minors, 3 for patches)
# before it is proposed — a compromised version is usually flagged and yanked
# inside that window. Cooldown applies to version updates only, never to
# security updates. Minor + patch bumps are grouped into one PR per ecosystem;
# majors stay separate so a breaking change gets its own review and CI run.
#
# Proposing is not merging: a human merges a bump only when it earns it (see
# AGENTS.md "Dependencies and in-housed code"). In-housed code is ours and is
# not tracked here. Dependabot cannot see the node runtime: the CI matrix in
# ci.yml tracks the `engines.node` range in package.json and moves by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions referenced by .github/workflows/*, pinned by commit SHA.
  # No cooldown, matching fleet.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
