version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errname
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - unconvert
    - whitespace
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck covers this with its own exclusions
        - G304 # file path from variable: the operator CLI reads operator-named files by design
        - G204 # subprocess with variable: the operator CLI runs systemctl/pg_dump/git by design
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - noctx
      # The operator tooling installs system files whose modes are part of
      # the contract (0644 units and banners, 0755 binaries and release
      # directories, 0640 environment files) and works on operator-configured
      # paths and URLs by design.
      - path: internal/(ops|cli)/
        linters:
          - gosec
        text: "G30[126]|G703|G704"
      - text: 'shadow: declaration of "err"'
        linters:
          - govet

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
